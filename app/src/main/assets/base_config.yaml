# Сгенерировано tools/build_base_config.py — вручную не править.
find-process-mode: 'off'
enable-process: false
mixed-port: 7890
allow-lan: true
bind-address: '*'
lan-allowed-ips:
- 0.0.0.0/0
- ::/0
skip-auth-prefixes:
- 127.0.0.1/32
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
keep-alive-interval: 120
keep-alive-idle: 120
unified-delay: true
tcp-concurrent: true
ipv6: false
profile:
  store-selected: false
  store-fake-ip: false
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - +.push.apple.com
dns:
  enable: true
  ipv6: false
  use-hosts: true
  enhanced-mode: redir-host
  cache-algorithm: arc
  prefer-h3: false
  default-nameserver:
  - 77.88.8.8
  - 77.88.8.1
  - 1.1.1.1
  nameserver:
  - https://dns.google/dns-query
  - https://cloudflare-dns.com/dns-query
  proxy-server-nameserver:
  - 77.88.8.8
  - 1.1.1.1
  nameserver-policy:
    '*.in-addr.arpa,*.ip6.arpa':
    - rcode://name_error
    '*.local,*.lan,*._udp,*._tcp':
    - rcode://name_error
